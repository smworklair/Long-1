<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КИС колледжа — ERP прототип</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--bg:#f3f5f8;--panel:#fff;--line:#d7dde6;--text:#1f2a37;--muted:#5d6b7b;--blue:#1f3b66;--blue2:#2a4e86;--ok:#2f7a4f;--warn:#9b6a1c;--bad:#8d2f2f}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
    .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
    .sidebar{background:#eef2f7;border-right:1px solid var(--line);padding:12px}
    .brand{font-weight:700;color:var(--blue);margin-bottom:10px}
    .meta{font-size:12px;color:var(--muted);margin-bottom:12px}
    .menu button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:8px;margin-bottom:6px;cursor:pointer}
    .menu button.active{background:var(--blue);color:#fff}
    .main{padding:12px}
    .toolbar{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:10px;margin-bottom:10px}
    .toolbar select,.toolbar input,.toolbar button{padding:6px;border:1px solid var(--line);background:#fff}
    .panel{background:var(--panel);border:1px solid var(--line);padding:10px;margin-bottom:10px}
    .grid{display:grid;gap:10px}.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:repeat(3,1fr)}
    table{width:100%;border-collapse:collapse} th,td{border:1px solid var(--line);padding:6px;text-align:left} th{background:#f7f9fc}
    .hidden{display:none}.badge{padding:2px 6px;border-radius:10px;font-size:12px}
    .paid{background:#dff4e7;color:#194f2f}.debt{background:#fbe2e2;color:#7a2020}
    h2{margin:0 0 8px;color:var(--blue)} h3{margin:0 0 8px;color:var(--blue2)}
    .student-card{border:1px solid var(--line);padding:8px;background:#fafcff}
    @media (max-width:1100px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:2}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">КИС колледжа</div>
    <div class="meta">Корпоративная информационная система</div>
    <div class="menu" id="menu"></div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <label>Роль:</label>
      <select id="roleSelect"></select>
      <input id="searchInput" placeholder="Поиск по ФИО / группе" />
      <button id="addStudentBtn">Добавить обучающегося</button>
      <span id="roleInfo"></span>
    </div>

    <section class="panel" id="studentsSection"></section>
    <section class="panel hidden" id="scheduleSection"></section>
    <section class="panel hidden" id="attendanceSection"></section>
    <section class="panel hidden" id="gradesSection"></section>
    <section class="panel hidden" id="financeSection"></section>
    <section class="panel hidden" id="hrSection"></section>
    <section class="panel hidden" id="admissionSection"></section>
    <section class="panel hidden" id="graduationSection"></section>
    <section class="panel hidden" id="analyticsSection"></section>
  </main>
</div>
<script>
const DB={
 roles:['Администратор','Преподаватель','Бухгалтер','Студент'],
 currentRole:localStorage.getItem('role')||'Администратор',
 students:JSON.parse(localStorage.getItem('students')||'null')||[
  {id:1,fio:'Иванов Павел Сергеевич',group:'ИС-21',avg:4.4,status:'обучается',stip:0,payment:'оплачено'},
  {id:2,fio:'Смирнова Анна Викторовна',group:'БУ-22',avg:4.9,status:'обучается',stip:4200,payment:'оплачено'},
  {id:3,fio:'Кузнецов Егор Романович',group:'ПС-23',avg:3.7,status:'обучается',stip:0,payment:'задолженность'}],
 schedule:JSON.parse(localStorage.getItem('schedule')||'null')||[
  {id:1,day:'Понедельник',time:'09:00',group:'ИС-21',subject:'Базы данных',teacher:'Петров И.И.',room:'204'},
  {id:2,day:'Понедельник',time:'11:00',group:'БУ-22',subject:'Бухгалтерский учёт',teacher:'Соколова Н.А.',room:'112'}],
 attendance:JSON.parse(localStorage.getItem('attendance')||'null')||{},
 grades:JSON.parse(localStorage.getItem('grades')||'null')||{1:[5,4,4],2:[5,5,5],3:[3,4,4]},
 payments:JSON.parse(localStorage.getItem('payments')||'null')||[{studentId:1,total:48000,paid:48000},{studentId:2,total:48000,paid:48000},{studentId:3,total:48000,paid:32000}],
 hr:[{name:'Петров И.И.',position:'Преподаватель',rate:'1.0'},{name:'Соколова Н.А.',position:'Преподаватель',rate:'1.25'},{name:'Орлова Т.В.',position:'Методист',rate:'1.0'}],
 admission:[{fio:'Громов Денис Олегович',program:'Информационные системы',status:'документы приняты'}],
 graduation:[{fio:'Ефимова Мария Андреевна',group:'ИС-19',result:'выпущен',date:'2026-06-30'}]
};
const save=()=>['students','schedule','attendance','grades','payments'].forEach(k=>localStorage.setItem(k,JSON.stringify(DB[k])));
const sections=[['students','База студентов'],['schedule','Планирование и расписание'],['attendance','Учёт посещаемости'],['grades','Электронный журнал'],['finance','Финансовый учёт'],['hr','Кадровый учёт'],['admission','Приём обучающихся'],['graduation','Выпуск обучающихся'],['analytics','Отчётность и аналитика']];
let active='students',chart;

function renderMenu(){menu.innerHTML=sections.map(([id,title])=>`<button data-id="${id}" class="${active===id?'active':''}">${title}</button>`).join('');menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.id;renderAll();});}
function roleAccess(){const r=DB.currentRole;return {showAdd:r==='Администратор'||r==='Приёмная комиссия',finance:r!=='Студент'&&r!=='Преподаватель',hr:r==='Администратор',attendance:r!=='Бухгалтер'};}
function calcAvg(arr){return (arr.reduce((a,b)=>a+b,0)/arr.length||0).toFixed(2)}
function calcStip(avg){avg=+avg;return avg>=4.75?5200:avg>=4.5?4200:avg>=4?3200:0}
function paymentStatus(sid){const p=DB.payments.find(x=>x.studentId===sid);return p&&p.paid>=p.total?'оплачено':'задолженность'}

function renderStudents(){
 const q=searchInput.value.toLowerCase();
 const data=DB.students.filter(s=>`${s.fio} ${s.group}`.toLowerCase().includes(q));
 studentsSection.innerHTML=`<h2>База студентов</h2><div class="grid grid-3">${data.map(s=>`<div class="student-card"><b>${s.fio}</b><br>Группа: ${s.group}<br>Ср. балл: ${s.avg}<br>Стипендия: ${s.stip} ₽<br>Оплата: <span class="badge ${s.payment==='оплачено'?'paid':'debt'}">${s.payment}</span><br><button onclick="editStudent(${s.id})">Изменить</button> <button onclick="deleteStudent(${s.id})">Удалить</button></div>`).join('')}</div>`;
}
window.deleteStudent=id=>{DB.students=DB.students.filter(s=>s.id!==id);DB.payments=DB.payments.filter(p=>p.studentId!==id);save();renderAll();};
window.editStudent=id=>{const s=DB.students.find(x=>x.id===id);const fio=prompt('ФИО',s.fio);if(!fio)return;const group=prompt('Группа',s.group);if(!group)return;s.fio=fio;s.group=group;save();renderAll();};

function renderSchedule(){scheduleSection.innerHTML=`<h2>Планирование учебного процесса и расписание</h2><table><tr><th>День</th><th>Время</th><th>Группа</th><th>Дисциплина</th><th>Преподаватель</th><th>Аудитория</th><th></th></tr>${DB.schedule.map(r=>`<tr><td>${r.day}</td><td>${r.time}</td><td>${r.group}</td><td>${r.subject}</td><td>${r.teacher}</td><td>${r.room}</td><td><button onclick="delLesson(${r.id})">Удалить</button></td></tr>`).join('')}</table><button onclick="addLesson()">Добавить занятие</button>`;}
window.addLesson=()=>{const day=prompt('День недели');if(!day)return;const time=prompt('Время');const group=prompt('Группа');const subject=prompt('Дисциплина');const teacher=prompt('Преподаватель');const room=prompt('Аудитория');DB.schedule.push({id:Date.now(),day,time,group,subject,teacher,room});save();renderAll();};
window.delLesson=id=>{DB.schedule=DB.schedule.filter(s=>s.id!==id);save();renderAll();};

function renderAttendance(){attendanceSection.innerHTML=`<h2>Учёт посещаемости</h2><table><tr><th>Обучающийся</th><th>Присутствие (сегодня)</th></tr>${DB.students.map(s=>{const v=DB.attendance[s.id]??true;return `<tr><td>${s.fio}</td><td><button onclick="toggleAtt(${s.id})">${v?'Присутствует':'Отсутствует'}</button></td></tr>`}).join('')}</table>`;}
window.toggleAtt=id=>{DB.attendance[id]=!(DB.attendance[id]??true);save();renderAll();};

function renderGrades(){DB.students.forEach(s=>{const arr=DB.grades[s.id]||[];s.avg=+calcAvg(arr);s.stip=calcStip(s.avg);s.payment=paymentStatus(s.id);});save();gradesSection.innerHTML=`<h2>Электронный журнал</h2><table><tr><th>ФИО</th><th>Оценки</th><th>Средний балл</th><th>Стипендия</th><th></th></tr>${DB.students.map(s=>`<tr><td>${s.fio}</td><td>${(DB.grades[s.id]||[]).join(', ')}</td><td>${s.avg}</td><td>${s.stip} ₽</td><td><button onclick="addGrade(${s.id})">Добавить оценку</button></td></tr>`).join('')}</table>`;}
window.addGrade=id=>{const g=+prompt('Оценка 2-5');if(g<2||g>5)return;DB.grades[id]=DB.grades[id]||[];DB.grades[id].push(g);save();renderAll();};

function renderFinance(){financeSection.innerHTML=`<h2>Финансовый учёт</h2><table><tr><th>ФИО</th><th>Начислено</th><th>Оплачено</th><th>Статус</th><th></th></tr>${DB.payments.map(p=>{const s=DB.students.find(x=>x.id===p.studentId);const st=p.paid>=p.total?'оплачено':'задолженность';return `<tr><td>${s?.fio||'—'}</td><td>${p.total}</td><td>${p.paid}</td><td>${st}</td><td><button onclick="payMore(${p.studentId})">Провести оплату</button></td></tr>`}).join('')}</table>`;}
window.payMore=id=>{const p=DB.payments.find(x=>x.studentId===id);const sum=+prompt('Сумма платежа');if(sum>0){p.paid=Math.min(p.total,p.paid+sum);save();renderAll();}};

function renderHr(){hrSection.innerHTML=`<h2>Кадровый учёт</h2><table><tr><th>Сотрудник</th><th>Должность</th><th>Ставка</th></tr>${DB.hr.map(x=>`<tr><td>${x.name}</td><td>${x.position}</td><td>${x.rate}</td></tr>`).join('')}</table>`;}
function renderAdmission(){admissionSection.innerHTML=`<h2>Приём обучающихся</h2><table><tr><th>ФИО абитуриента</th><th>Направление</th><th>Статус</th></tr>${DB.admission.map(x=>`<tr><td>${x.fio}</td><td>${x.program}</td><td>${x.status}</td></tr>`).join('')}</table>`;}
function renderGraduation(){graduationSection.innerHTML=`<h2>Выпуск обучающихся</h2><table><tr><th>ФИО</th><th>Группа</th><th>Результат</th><th>Дата</th></tr>${DB.graduation.map(x=>`<tr><td>${x.fio}</td><td>${x.group}</td><td>${x.result}</td><td>${x.date}</td></tr>`).join('')}</table>`;}
function renderAnalytics(){analyticsSection.innerHTML=`<h2>Отчётность и аналитика</h2><div class="grid grid-2"><div><canvas id="chart1"></canvas></div><div><table><tr><th>Показатель</th><th>Значение</th></tr><tr><td>Контингент</td><td>${DB.students.length}</td></tr><tr><td>Средний балл по колледжу</td><td>${calcAvg(DB.students.map(s=>s.avg||0))}</td></tr><tr><td>Задолженность по оплате</td><td>${DB.payments.filter(p=>p.paid<p.total).length}</td></tr><tr><td>Посещаемость сегодня</td><td>${Math.round((Object.values(DB.attendance).filter(Boolean).length/Math.max(1,DB.students.length))*100)}%</td></tr></table></div></div>`;
 const ctx=document.getElementById('chart1'); if(chart) chart.destroy();
 chart=new Chart(ctx,{type:'bar',data:{labels:DB.students.map(s=>s.fio.split(' ')[0]),datasets:[{label:'Средний балл',data:DB.students.map(s=>s.avg),backgroundColor:'#2a4e86'},{label:'Стипендия/1000',data:DB.students.map(s=>s.stip/1000),backgroundColor:'#7d93b7'}]}});
}

function renderAll(){
 roleSelect.innerHTML=DB.roles.map(r=>`<option ${DB.currentRole===r?'selected':''}>${r}</option>`).join('');
 roleInfo.textContent=`Текущий пользователь: ${DB.currentRole}`;
 const access=roleAccess(); addStudentBtn.style.display=access.showAdd?'inline-block':'none';
 document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden')); document.getElementById(active+'Section').classList.remove('hidden');
 renderMenu(); renderStudents(); renderSchedule(); renderAttendance(); renderGrades(); renderFinance(); renderHr(); renderAdmission(); renderGraduation(); renderAnalytics();
 if(!access.finance && active==='finance'){active='students';renderAll();return}
 if(!access.hr && active==='hr'){active='students';renderAll();return}
 if(!access.attendance && active==='attendance'){active='students';renderAll();return}
}
roleSelect.onchange=e=>{DB.currentRole=e.target.value;localStorage.setItem('role',DB.currentRole);renderAll();};
searchInput.oninput=renderStudents;
addStudentBtn.onclick=()=>{const fio=prompt('ФИО');if(!fio)return;const group=prompt('Группа');if(!group)return;const id=Date.now();DB.students.push({id,fio,group,avg:0,status:'обучается',stip:0,payment:'задолженность'});DB.grades[id]=[];DB.payments.push({studentId:id,total:48000,paid:0});save();renderAll();};
renderAll();
</script>
</body>
</html>
